<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Research, people, and discoveries from the [Lab Name] laboratory." />
  <title>EcoNetLab @ iDiv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #172b35;
      --muted: #61727a;
      --paper: #f7f8f5;
      --white: #fff;
      --teal: #287d78;
      --mint: #dceee8;
      --line: #e2e8e4;
      --radius: 22px;
      --shadow: 0 18px 55px rgba(23, 43, 53, .08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "DM Sans", sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .container { width: min(1160px, calc(100% - 48px)); margin-inline: auto; }

    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(247, 248, 245, .88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 228, .8);
    }
    .nav {
      min-height: 82px; display: flex; align-items: center;
      justify-content: space-between; gap: 28px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.04em; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: 12px; color: white; background: var(--teal);
      font-family: "Manrope", sans-serif; font-size: 20px;
    }
    .brand span:last-child { font-size: 17px; }
    .nav-links { display: flex; gap: 30px; align-items: center; color: var(--muted); font-size: 14px; }
    .nav-links a:hover { color: var(--teal); }
    .nav-cta {
      padding: 11px 17px; border-radius: 999px; background: var(--ink);
      color: white !important; font-weight: 600;
    }
    .menu-button { display: none; border: 0; background: none; font-size: 25px; color: var(--ink); }

    .hero { padding: 78px 0 86px; }
    .hero-grid { display: grid; grid-template-columns: 1.02fr .98fr; gap: 64px; align-items: center; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--teal); font-size: 12px; font-weight: 700;
      letter-spacing: .13em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 26px; height: 2px; background: var(--teal); }
    h1, h2, h3 { font-family: "Manrope", sans-serif; line-height: 1.12; letter-spacing: -.045em; }
    h1 { margin: 22px 0; font-size: clamp(42px, 5.3vw, 70px); font-weight: 700; }
    h1 em { color: var(--teal); font-style: normal; }
    .hero-copy { max-width: 530px; color: var(--muted); font-size: 17px; }
    .actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 30px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 21px; border-radius: 999px; font-size: 14px; font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .button:hover { transform: translateY(-2px); }
    .button-primary { background: var(--teal); color: white; box-shadow: 0 8px 22px rgba(40, 125, 120, .2); }
    .button-secondary { border: 1px solid var(--line); background: white; }
    .hero-visual { position: relative; min-height: 430px; }
    .hero-image {
      position: absolute; inset: 0 0 25px 25px; overflow: hidden;
      border-radius: 34px; background: #d9e8e2;
      box-shadow: var(--shadow);
    }
    .hero-image img { width: 100%; height: 100%; object-fit: cover; }
    .image-note {
      position: absolute; left: 0; bottom: 0; padding: 17px 20px;
      max-width: 245px; border: 1px solid rgba(255,255,255,.7);
      border-radius: 18px; background: rgba(255,255,255,.92);
      box-shadow: var(--shadow); font-size: 13px;
    }
    .image-note strong { display: block; margin-bottom: 3px; font-size: 14px; }
    .image-note span { color: var(--muted); }

    section { padding: 88px 0; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 28px; margin-bottom: 34px; }
    .section-head h2 { margin: 12px 0 0; font-size: clamp(30px, 3.5vw, 44px); }
    .section-head p { max-width: 440px; margin: 0; color: var(--muted); }
    .research-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .research-card {
      padding: 28px; border: 1px solid var(--line); border-radius: var(--radius);
      background: white; transition: transform .2s ease, box-shadow .2s ease;
    }
    .research-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
    .card-icon {
      width: 48px; height: 48px; display: grid; place-items: center;
      margin-bottom: 24px; border-radius: 15px; background: var(--mint);
      color: var(--teal); font-size: 23px;
    }
    .research-card h3 { margin: 0 0 12px; font-size: 21px; }
    .research-card p { margin: 0; color: var(--muted); font-size: 14px; }
    .text-link { display: inline-block; margin-top: 22px; color: var(--teal); font-weight: 700; font-size: 13px; }

    .highlight { background: #edf3ef; }
    .highlight-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 70px; align-items: center; }
    .highlight h2 { margin: 15px 0 20px; font-size: clamp(32px, 4vw, 48px); }
    .highlight p { color: var(--muted); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 30px; }
    .stat { padding-top: 17px; border-top: 1px solid #cddbd4; }
    .stat strong { display: block; font-family: "Manrope", sans-serif; font-size: 30px; letter-spacing: -.05em; }
    .stat span { color: var(--muted); font-size: 12px; }
    .highlight-photo { height: 390px; overflow: hidden; border-radius: 28px; box-shadow: var(--shadow); }
    .highlight-photo img { width: 100%; height: 100%; object-fit: cover; }

    .news-list { border-top: 1px solid var(--line); }
    .news-item {
      display: grid; grid-template-columns: 120px 1fr auto; gap: 25px;
      align-items: center; padding: 23px 0; border-bottom: 1px solid var(--line);
    }
    .news-date { color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .news-item h3 { margin: 0 0 5px; font-size: 18px; letter-spacing: -.025em; }
    .news-item p { margin: 0; color: var(--muted); font-size: 14px; }
    .arrow { color: var(--teal); font-size: 22px; }

    .join {
      padding: 55px; border-radius: 28px; color: white;
      background: var(--ink); display: flex; align-items: center;
      justify-content: space-between; gap: 35px;
    }
    .join h2 { margin: 0 0 12px; font-size: clamp(30px, 3.5vw, 42px); }
    .join p { max-width: 560px; margin: 0; color: #c2d0d3; }
    .join .button { flex-shrink: 0; background: white; color: var(--ink); }

    footer { padding: 35px 0; border-top: 1px solid var(--line); }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; color: var(--muted); font-size: 13px; }
    .footer-links { display: flex; gap: 22px; }
    .footer-links a:hover { color: var(--teal); }

    @media (max-width: 850px) {
      .hero-grid, .highlight-grid { grid-template-columns: 1fr; gap: 42px; }
      .hero { padding-top: 55px; }
      .hero-visual { min-height: 370px; }
      .research-grid { grid-template-columns: 1fr 1fr; }
      .section-head { align-items: start; flex-direction: column; }
      .highlight-photo { height: 330px; }
      .join { padding: 38px; align-items: start; flex-direction: column; }
    }
    @media (max-width: 620px) {
      .container { width: min(100% - 32px, 1160px); }
      .nav { min-height: 70px; }
      .menu-button { display: block; }
      .nav-links {
        display: none; position: absolute; top: 70px; left: 0; right: 0;
        padding: 20px 24px 25px; background: var(--paper);
        border-bottom: 1px solid var(--line); flex-direction: column; align-items: stretch; gap: 18px;
      }
      .nav-links.open { display: flex; }
      .nav-cta { text-align: center; }
      .hero { padding: 45px 0 60px; }
      h1 { font-size: 43px; }
      .hero-copy { font-size: 15px; }
      .hero-visual { min-height: 300px; }
      .hero-image { inset: 0 0 20px 12px; border-radius: 25px; }
      .image-note { max-width: 220px; padding: 13px 15px; }
      section { padding: 65px 0; }
      .research-grid { grid-template-columns: 1fr; }
      .stats { gap: 10px; }
      .stat strong { font-size: 25px; }
      .news-item { grid-template-columns: 1fr auto; gap: 8px 15px; }
      .news-date { grid-column: 1 / -1; }
      .news-item h3 { font-size: 16px; }
      .join { padding: 28px; }
      .footer-inner { align-items: start; flex-direction: column; }
      .footer-links { flex-wrap: wrap; }
    }
  </style>
</head>
